# Build the static site and publish it to the university server on every push to main.
# Secret required: SERVER_SSH_KEY (private key whose public half is in the server's authorized_keys).
name: Deploy to university server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  SERVER: aginsight@aginsight.agri.sab.ac.lk
  WEBROOT: /var/www/html/aginsight/
  # Pinned host key (from `ssh-keyscan -t ed25519 aginsight.agri.sab.ac.lk`)
  KNOWN_HOST: aginsight.agri.sab.ac.lk ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ0e2LDIM3cmyqhjntVUWDsah3vIi1OrMH1x/rMUy9D+

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOST" > ~/.ssh/known_hosts

      - name: Sync out/ to the server
        # --delete removes files dropped from the site; the excludes protect server-only folders
        run: |
          rsync -rlz --delete --chmod=D755,F644 \
            --exclude='/.ssh/' --exclude='/.esmtp_queue/' --exclude='/.wp-content-leftover/' --exclude='/.assetsignore' \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            out/ "$SERVER:$WEBROOT"

      - name: Check the live site
        run: |
          for u in / /call-for-papers/ /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://aginsight.agri.sab.ac.lk$u")
            echo "$code $u"; [ "$code" = 200 ]
          done
